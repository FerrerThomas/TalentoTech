# ===================================================================
# CONFIGURACIÓN DE LA APLICACIÓN TECHLAB E-COMMERCE
# Curso Java Back-End - Talento Tech / Buenos Aires Aprende
# ===================================================================

server.port=8080
spring.application.name=techlab-ecommerce

# -------------------------------------------------------------------
# OPCIÓN A: Conexión con Base de Datos MySQL (Visto en Clases 12 y 13)
# Asegúrese de haber creado la base: CREATE DATABASE techlabdb;
# -------------------------------------------------------------------
spring.datasource.url=jdbc:mysql://localhost:3306/techlabdb?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true&createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# -------------------------------------------------------------------
# Configuración de Hibernate / Spring Data JPA
# -------------------------------------------------------------------
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# -------------------------------------------------------------------
# OPCIÓN B: Modo desarrollo / pruebas sin MySQL (H2 en memoria)
# Por defecto la aplicación usa MySQL (Opción A).
# Si no tiene MySQL instalado o activo, puede usar H2 de dos maneras:
#   1) Descomentar la siguiente línea:
# spring.profiles.active=h2
#   2) O sin tocar este archivo, al ejecutar:
#      mvn spring-boot:run -Dspring-boot.run.profiles=h2
#      java -jar target/ecommerce-backend-1.0.0.jar --spring.profiles.active=h2
# -------------------------------------------------------------------
